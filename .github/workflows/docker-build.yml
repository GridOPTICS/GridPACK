name: Docker Multi-Architecture Build and Publish

on:
  # Manual workflow dispatch - can be triggered from any branch
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag to use'
        required: false
        default: 'dev'
      skip_tests:
        description: 'Skip ctest smoke tests'
        required: false
        type: boolean
        default: false
      platforms:
        description: 'Target platforms (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
      dockerfile:
        description: 'Dockerfile to use'
        required: false
        default: './Dockerfile'

jobs:
  build-and-push:
    name: Build and Push Multi-Architecture Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/gp
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile || './Dockerfile' }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            boost_version=1.81.0
            ga_version=5.9.1
            petsc_version=3.24.2

      - name: Inspect multi-arch manifest
        run: |
          echo "Inspecting multi-architecture manifest..."
          # Get the first tag from the tags output
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker buildx imagetools inspect ${TAG}

      - name: Run ctest smoke tests
        if: ${{ !inputs.skip_tests }}
        continue-on-error: true
        run: |
          echo "Running ctest smoke tests..."
          echo "Note: Test failures will NOT cause the workflow to fail (continue-on-error: true)"
          echo "Typical pass rate: ~94%"
          echo ""
          
          # Get the first tag from the tags output
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker run --rm ${TAG} bash -c "cd /app/src/build && ctest -j"
